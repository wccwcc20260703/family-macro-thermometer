name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check data cache
        id: data
        run: |
          if [ -f dist/data.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh public data
        if: github.event_name != 'push' || steps.data.outputs.missing == 'true'
        run: python scripts/update_data.py
      - name: Save refreshed data
        if: github.event_name != 'push' || steps.data.outputs.missing == 'true'
        run: |
          if [ -n "$(git status --porcelain -- dist/data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/data.json
            git commit -m "chore: refresh macro dashboard data"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
